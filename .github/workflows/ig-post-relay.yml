name: ig-post-relay

on:
  workflow_dispatch:
    inputs:
      slide_urls:
        description: 'JSON array of public image URLs'
        required: true
      caption:
        description: 'Caption text'
        required: true
      ig_id:
        description: 'Instagram Business ID'
        required: true
      ig_token:
        description: 'Instagram access token'
        required: true
      log_tag:
        description: 'Short tag for commit message'
        required: false
        default: 'relay'

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Post carousel
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, time, urllib.request, urllib.parse, urllib.error

          slide_urls = json.loads(os.environ["INPUT_SLIDE_URLS"])
          caption    = os.environ["INPUT_CAPTION"]
          ig_id      = os.environ["INPUT_IG_ID"].strip()
          ig_token   = os.environ["INPUT_IG_TOKEN"].strip()

          base = f"https://graph.facebook.com/v23.0/{ig_id}"

          def ig_post(ep, params):
              data = urllib.parse.urlencode(params).encode()
              req = urllib.request.Request(f"{base}/{ep}", data=data, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return {"error": e.read().decode()[:500]}
              except Exception as e:
                  return {"error": str(e)}

          def ig_get(url):
              try:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return {"error": e.read().decode()[:500]}
              except Exception as e:
                  return {"error": str(e)}

          print(f"[relay] posting {len(slide_urls)} slides to ig_id={ig_id[:8]}...")

          child_ids = []
          for i, url in enumerate(slide_urls):
              print(f"  slide {i+1}: {url}")
              r = ig_post("media", {
                  "image_url": url,
                  "is_carousel_item": "true",
                  "is_aigc": "true",
                  "alt_text": f"Slide {i+1}: {caption.splitlines()[0][:90]}",
                  "access_token": ig_token,
              })
              print(f"  child {i+1}: {r}")
              if "id" not in r:
                  print(f"[relay] ERROR child {i+1}: {r}")
                  sys.exit(1)
              child_ids.append(r["id"])

          parent = ig_post("media", {
              "media_type": "CAROUSEL",
              "children": ",".join(child_ids),
              "caption": caption,
              "is_aigc": "true",
              "access_token": ig_token,
          })
          print(f"[relay] carousel: {parent}")
          if "id" not in parent:
              print(f"[relay] ERROR carousel: {parent}")
              sys.exit(1)
          creation_id = parent["id"]

          for attempt in range(30):
              status = ig_get(f"{base}/{creation_id}?fields=status_code&access_token={ig_token}")
              sc = status.get("status_code", "")
              print(f"  poll {attempt+1}: {sc}")
              if sc == "FINISHED":
                  break
              if sc == "ERROR":
                  print(f"[relay] ERROR status: {status}")
                  sys.exit(1)
              time.sleep(5)

          pub = ig_post("media_publish", {"creation_id": creation_id, "access_token": ig_token})
          print(f"[relay] publish: {pub}")
          if "id" not in pub:
              print(f"[relay] ERROR publish: {pub}")
              sys.exit(1)
          media_id = pub["id"]

          perma = ig_get(f"https://graph.facebook.com/v23.0/{media_id}?fields=permalink&access_token={ig_token}")
          permalink = perma.get("permalink", "")
          print(f"\n[relay] SUCCESS media_id={media_id} permalink={permalink}")

          log_path = "relay_log.jsonl"
          with open(log_path, "a") as f:
              f.write(json.dumps({"ts": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                                  "media_id": media_id, "permalink": permalink}) + "\n")
          PYEOF
        env:
          INPUT_SLIDE_URLS: ${{ github.event.inputs.slide_urls }}
          INPUT_CAPTION: ${{ github.event.inputs.caption }}
          INPUT_IG_ID: ${{ github.event.inputs.ig_id }}
          INPUT_IG_TOKEN: ${{ github.event.inputs.ig_token }}
      - name: Commit log
        if: always()
        run: |
          git config user.name "Hayat Amin"
          git config user.email "hayat@beyondelevation.com"
          git add relay_log.jsonl || true
          git diff --cached --quiet || git commit -m "relay: posted carousel ${{ github.event.inputs.log_tag }}"
          git push || true
