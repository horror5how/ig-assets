name: post-to-instagram

on:
  workflow_dispatch:
    inputs:
      slide_urls:
        description: 'JSON array of 6 public image URLs'
        required: true
      caption:
        description: 'Caption text'
        required: true
      ig_id:
        description: 'Instagram Business ID'
        required: true
      ig_token:
        description: 'Instagram access token'
        required: true

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Post carousel to Instagram
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, time, urllib.request, urllib.parse, urllib.error

          slide_urls = json.loads(os.environ["INPUT_SLIDE_URLS"])
          caption    = os.environ["INPUT_CAPTION"]
          ig_id      = os.environ["INPUT_IG_ID"].strip()
          ig_token   = os.environ["INPUT_IG_TOKEN"].strip()
          base = f"https://graph.facebook.com/v23.0/{ig_id}"

          def ig_post(endpoint, params):
              data = urllib.parse.urlencode(params).encode()
              req  = urllib.request.Request(f"{base}/{endpoint}", data=data, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return {"error": e.read().decode()[:800]}
              except Exception as e:
                  return {"error": str(e)}

          def ig_get(url):
              try:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return {"error": e.read().decode()[:400]}
              except Exception as e:
                  return {"error": str(e)}

          print(f"Posting {len(slide_urls)} slides to IG account {ig_id}")

          child_ids = []
          for i, url in enumerate(slide_urls):
              r = ig_post("media", {
                  "image_url": url,
                  "is_carousel_item": "true",
                  "is_aigc": "true",
                  "alt_text": f"Slide {i+1}: {caption.split(chr(10))[0][:80]}",
                  "access_token": ig_token,
              })
              print(f"  child {i+1}: {r}")
              if "id" not in r:
                  print(f"FAIL: child {i+1}: {r}")
                  sys.exit(1)
              child_ids.append(r["id"])

          parent = ig_post("media", {
              "media_type": "CAROUSEL",
              "children": ",".join(child_ids),
              "caption": caption,
              "is_aigc": "true",
              "access_token": ig_token,
          })
          print(f"Carousel container: {parent}")
          if "id" not in parent:
              sys.exit(1)
          creation_id = parent["id"]

          for attempt in range(30):
              status = ig_get(f"{base}/{creation_id}?fields=status_code&access_token={ig_token}")
              sc = status.get("status_code", "")
              print(f"  poll {attempt+1}: {sc}")
              if sc == "FINISHED":
                  break
              if sc == "ERROR":
                  print(f"FAIL: processing error: {status}")
                  sys.exit(1)
              time.sleep(5)

          pub = ig_post("media_publish", {
              "creation_id": creation_id,
              "access_token": ig_token,
          })
          print(f"Publish result: {pub}")
          if "id" not in pub:
              sys.exit(1)
          media_id = pub["id"]
          perma = ig_get(f"https://graph.facebook.com/v23.0/{media_id}?fields=permalink&access_token={ig_token}")
          print(f"SUCCESS: media_id={media_id} permalink={perma.get('permalink','')}")
          PYEOF
        env:
          INPUT_SLIDE_URLS: ${{ github.event.inputs.slide_urls }}
          INPUT_CAPTION: ${{ github.event.inputs.caption }}
          INPUT_IG_ID: ${{ github.event.inputs.ig_id }}
          INPUT_IG_TOKEN: ${{ github.event.inputs.ig_token }}
