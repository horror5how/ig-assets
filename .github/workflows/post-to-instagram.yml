name: Post Instagram Carousel

on:
  push:
    paths:
      - 'posts/*/slide_01.png'
      - 'posts/*/caption.txt'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Post slug directory name'
        required: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
          fetch-depth: 2

      - name: Find latest post slug
        id: slug
        run: |
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            echo "slug=${{ github.event.inputs.slug }}" >> $GITHUB_OUTPUT
          else
            SLUG=$(git diff HEAD~1..HEAD --name-only 2>/dev/null | grep "^posts/" | sed 's|posts/||;s|/.*||' | sort -u | head -1)
            if [ -z "$SLUG" ]; then
              # Fallback: find newest post without media_id.txt
              SLUG=$(find posts -maxdepth 1 -mindepth 1 -type d | while read d; do
                slug=$(basename "$d")
                if [ ! -f "posts/$slug/media_id.txt" ] && [ -f "posts/$slug/caption.txt" ]; then
                  echo "$slug"
                fi
              done | sort -r | head -1)
            fi
            echo "slug=$SLUG" >> $GITHUB_OUTPUT
            echo "Detected slug: $SLUG"
          fi

      - name: Check idempotency
        id: check
        run: |
          SLUG="${{ steps.slug.outputs.slug }}"
          if [ -z "$SLUG" ]; then echo "ERROR: empty slug"; exit 1; fi
          if [ -f "posts/${SLUG}/media_id.txt" ]; then
            EXISTING=$(cat "posts/${SLUG}/media_id.txt")
            echo "already_posted=true" >> $GITHUB_OUTPUT
            echo "media_id=${EXISTING}" >> $GITHUB_OUTPUT
            echo "Already posted: media_id=${EXISTING} — skipping re-post"
          else
            echo "already_posted=false" >> $GITHUB_OUTPUT
            echo "Not yet posted — proceeding"
          fi

      - name: Build image URLs
        if: steps.check.outputs.already_posted == 'false'
        id: urls
        run: |
          SLUG="${{ steps.slug.outputs.slug }}"
          SHA="${{ github.sha }}"
          BASE="https://raw.githubusercontent.com/${{ github.repository }}/${SHA}/posts/${SLUG}"
          URLS=""
          for i in 01 02 03 04 05 06; do
            FILE="posts/${SLUG}/slide_${i}.png"
            if [ -f "$FILE" ]; then
              URLS="${URLS}${BASE}/slide_${i}.png,"
            fi
          done
          URLS="${URLS%,}"
          echo "urls=${URLS}" >> $GITHUB_OUTPUT
          echo "Image URLs: $URLS"
          wc -c "posts/${SLUG}/caption.txt" || (echo "caption.txt missing"; exit 1)

      - name: Post carousel to Instagram
        if: steps.check.outputs.already_posted == 'false'
        id: post
        run: |
          set -e
          SLUG="${{ steps.slug.outputs.slug }}"
          IG_ID="${{ secrets.ACTIVE_IG_BUSINESS_ID }}"
          IG_TOKEN="${{ secrets.ACTIVE_IG_TOKEN }}"
          GRAPH="https://graph.facebook.com/v23.0"
          URLS="${{ steps.urls.outputs.urls }}"

          echo "IG_ID length: ${#IG_ID}"
          echo "Token length: ${#IG_TOKEN}"

          if [ -z "$IG_ID" ] || [ -z "$IG_TOKEN" ]; then
            echo "ERROR: Missing IG secrets"
            exit 1
          fi

          echo "Posting $SLUG"
          CHILD_IDS=""
          IFS=',' read -ra URL_ARRAY <<< "$URLS"
          for URL in "${URL_ARRAY[@]}"; do
            echo "Child: $URL"
            RESP=$(curl -s -X POST "${GRAPH}/${IG_ID}/media" \
              --data-urlencode "image_url=${URL}" \
              --data-urlencode "is_carousel_item=true" \
              --data-urlencode "access_token=${IG_TOKEN}")
            echo "API response: $RESP"
            if echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); exit(0 if 'id' in d else 1)" 2>/dev/null; then
              ID=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
              CHILD_IDS="${CHILD_IDS}${ID},"
              echo "  -> $ID"
            else
              echo "ERROR creating child media container"
              exit 1
            fi
          done
          CHILD_IDS="${CHILD_IDS%,}"
          echo "Child IDs: $CHILD_IDS"

          CAPTION_TEXT=$(cat "posts/${SLUG}/caption.txt")
          echo "Caption length: ${#CAPTION_TEXT}"

          CAROUSEL=$(curl -s -X POST "${GRAPH}/${IG_ID}/media" \
            --data-urlencode "media_type=CAROUSEL" \
            --data-urlencode "children=${CHILD_IDS}" \
            --data-urlencode "caption=${CAPTION_TEXT}" \
            --data-urlencode "access_token=${IG_TOKEN}")
          echo "Carousel response: $CAROUSEL"
          if ! echo "$CAROUSEL" | python3 -c "import json,sys; d=json.load(sys.stdin); exit(0 if 'id' in d else 1)" 2>/dev/null; then
            echo "ERROR creating carousel container"
            exit 1
          fi
          CAROUSEL_ID=$(echo "$CAROUSEL" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "Carousel container: $CAROUSEL_ID"

          sleep 5
          PUB=$(curl -s -X POST "${GRAPH}/${IG_ID}/media_publish" \
            --data-urlencode "creation_id=${CAROUSEL_ID}" \
            --data-urlencode "access_token=${IG_TOKEN}")
          echo "Publish response: $PUB"
          if ! echo "$PUB" | python3 -c "import json,sys; d=json.load(sys.stdin); exit(0 if 'id' in d else 1)" 2>/dev/null; then
            echo "ERROR publishing carousel"
            exit 1
          fi
          MEDIA_ID=$(echo "$PUB" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "Published: media_id=${MEDIA_ID}"
          echo "media_id=${MEDIA_ID}" >> $GITHUB_OUTPUT

      - name: Resolve final media_id
        id: final
        run: |
          if [ "${{ steps.check.outputs.already_posted }}" = "true" ]; then
            echo "media_id=${{ steps.check.outputs.media_id }}" >> $GITHUB_OUTPUT
          else
            echo "media_id=${{ steps.post.outputs.media_id }}" >> $GITHUB_OUTPUT
          fi

      - name: Update relay log and commit
        if: steps.final.outputs.media_id != ''
        run: |
          SLUG="${{ steps.slug.outputs.slug }}"
          MEDIA_ID="${{ steps.final.outputs.media_id }}"
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "$MEDIA_ID" > "posts/${SLUG}/media_id.txt"

          if ! grep -q "$MEDIA_ID" relay_log.jsonl 2>/dev/null; then
            echo "{\"ts\":\"${TS}\",\"slug\":\"${SLUG}\",\"media_id\":\"${MEDIA_ID}\"}" >> relay_log.jsonl
          fi

          git config user.name "hayat@beyondelevation.com"
          git config user.email "hayat@beyondelevation.com"
          git add "posts/${SLUG}/media_id.txt" relay_log.jsonl

          if git diff --cached --quiet; then
            echo "Nothing to commit (already logged)"
          else
            git commit -m "log: ${SLUG} media_id=${MEDIA_ID}"
            REMOTE_URL=$(git remote get-url origin | sed "s|https://|https://x-access-token:${{ secrets.PAT_TOKEN || github.token }}@|")
            git push "$REMOTE_URL" main
            echo "Relay log committed and pushed"
          fi
          echo "Final media_id: $MEDIA_ID"
